server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: camunda-workflow-backend
  datasource:
    url: jdbc:h2:mem:camundadb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console

camunda:
  bpm:
    admin-user:
      id: admin
      password: adminpassword
      firstName: System
      lastName: Administrator
      email: admin@company.com
    filter:
      create: All Tasks
    job-execution:
      enabled: true
      active: true
    database:
      schema-update: true
    webapp:
      index-redirect-enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    org.camunda.bpm: INFO
    com.company.workflow: DEBUG



