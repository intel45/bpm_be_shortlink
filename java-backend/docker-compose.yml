version: '3.8'
services:
  postgres:
    image: postgres:15
    container_name: postgres-congvan
    restart: always
    environment:
      POSTGRES_DB: congvan
      POSTGRES_USER: root
      POSTGRES_PASSWORD: 123456aA
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/main/resources/data.sql:/docker-entrypoint-initdb.d/data.sql:ro

volumes:
  postgres_data:
